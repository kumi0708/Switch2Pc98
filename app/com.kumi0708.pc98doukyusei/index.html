<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>PC-98 同級生</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #e0e0e0;
  font-family: 'MS Gothic', 'Osaka-Mono', sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* Fills whatever viewport the runtime gives us (1280x720 on Switch).
   The canvas is sized in JS (layout()) so no CSS aspect-ratio support
   is needed. */
#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: row;
  background: #000;
}

#screen-container {
  position: relative;
  flex: 1;
  height: 100%;
  /* Leave room for the now-fixed panel. */
  margin-right: 160px;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#screen {
  display: block;
  background: #000;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

.overlay {
  position: absolute;
  left: 0; top: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.overlay.hidden { display: none; }

.overlay-msg {
  color: #88aaff;
  font-size: 24px;
  text-align: center;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
}
.overlay-msg.error { color: #ff8888; font-size: 18px; text-align: left; }

/* Drive LED, in the screen area's top-right corner rather than in the
   status column — it updates several times a second and sat on top of the
   other status lines when the panel ran out of vertical room. */
.fdd-led {
  position: absolute;
  right: 12px;
  top: 12px;
  padding: 4px 10px;
  background: #1a1200;
  border: 1px solid #5a4400;
  color: #ffaa00;
  font-size: 14px;
  line-height: 16px;
  white-space: nowrap;
}
.fdd-led.hidden { display: none; }

.toast {
  position: absolute;
  left: 20px;
  top: 20px;
  padding: 10px 18px;
  background: #141e3c;
  border: 2px solid #4a6fd8;
  color: #fff;
  font-size: 22px;
}
.toast.hidden { display: none; }

/* ---- side panel ---- */
/* Fixed rather than a flex child: in the host's fullscreen-canvas mode only
   the canvas and fixed-position elements are painted, so a panel in normal
   flow would disappear the moment the emulator goes fullscreen. */
#panel {
  position: fixed;
  right: 0;
  top: 0;
  /* Above the canvas, which now spans the whole viewport. */
  z-index: 10;
  width: 160px;
  height: 100%;
  background: #1c1c2e;
  border-left: 2px solid #444;
  padding: 8px 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.panel-title {
  color: #88aaff;
  font-weight: bold;
  font-size: 16px;
  text-align: center;
  line-height: 1.3;
}

.drive-head {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 3px;
  white-space: nowrap;
}

.drive-label { color: #ffd866; font-weight: bold; }

.disk-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.disk-btn {
  width: 44px;
  height: 36px;
  background: #3a3a55;
  color: #ccc;
  border: 1px solid #666;
  font-size: 16px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
}
.disk-btn.active { background: #2255aa; color: #fff; border-color: #88aaff; }
.disk-btn.loading { background: #555522; color: #ffd866; }

.panel-buttons {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 4px;
}

.btn {
  width: 100%;
  height: 36px;
  background: #3a3a55;
  color: #ccc;
  border: 1px solid #666;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}
.btn.active { background: #2255aa; color: #fff; }

/* The help block is the only part allowed to give up space: without
   min-height/overflow it keeps its full height in the column and squeezes
   the status lines on top of each other on a 720px-tall screen. */
.help {
  margin-top: auto;
  color: #777;
  font-size: 11px;
  line-height: 1.5;
  min-height: 0;
  overflow: hidden;
  flex-shrink: 1;
}

#status-bar {
  display: flex;
  flex-direction: column;
  font-size: 11px;
  color: #888;
  border-top: 1px solid #333;
  padding-top: 4px;
  flex-shrink: 0;
}
#status-bar > span {
  display: block;
  min-height: 14px;
  line-height: 14px;
  white-space: nowrap;
  overflow: hidden;
}
#cpu-speed { color: #8fd; }
/* The geometry readout is longer than the panel is wide, and the shared
   status-span rule clips anything that overflows — let this one wrap. */
/* Specificity has to beat `#status-bar > span`, which sets nowrap/clip. */
#status-bar > span#geom {
  color: #9a9;
  white-space: normal;
  overflow: visible;
  line-height: 13px;
  min-height: 0;
  word-break: break-all;
}
#fdd-activity { color: #ffaa00; }

/* ---- virtual keyboard overlay ---- */
.vkbd {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 8px;
  background: #0a0c1e;
  border-top: 2px solid #4a6fd8;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.vkbd.hidden { display: none; }

.vk-row {
  display: flex;
  gap: 5px;
  justify-content: center;
}

.vk {
  min-width: 56px;
  height: 46px;
  padding: 0 8px;
  background: #33364d;
  color: #eee;
  border: 1px solid #6a6f95;
  font-size: 18px;
  font-family: inherit;
  cursor: pointer;
}
.vk.wide { min-width: 96px; }
.vk.xwide { min-width: 240px; }
.vk.down { background: #2255aa; color: #fff; }

</style>
</head>
<body>
<div id="app">
  <div id="screen-container">
    <!-- `data-fullscreen-live` tells the host that this canvas drives its own
         render loop, so entering fullscreen-canvas mode must NOT re-run the
         page scripts (that would restart the emulator and wipe its state). -->
    <canvas id="screen" width="640" height="400" data-fullscreen-live></canvas>
    <div id="overlay" class="overlay">
      <div class="overlay-msg" id="overlay-msg">起動中...</div>
    </div>
    <div id="fdd-led" class="fdd-led hidden">● FDD</div>
    <div id="toast" class="toast hidden"></div>
    <div id="vkbd" class="vkbd hidden"></div>
  </div>

  <div id="panel">
    <div class="panel-title">PC-98<br>同級生</div>

    <div class="drive">
      <div class="drive-head">FDD1 <span id="fdd1-label" class="drive-label">-</span></div>
      <div class="disk-grid" id="fdd1-grid"></div>
    </div>

    <div class="drive">
      <div class="drive-head">FDD2 <span id="fdd2-label" class="drive-label">-</span></div>
      <div class="disk-grid" id="fdd2-grid"></div>
    </div>

    <div class="panel-buttons">
      <button id="btn-kbd" class="btn">キーボード</button>
      <button id="btn-pause" class="btn">一時停止</button>
      <button id="btn-reset" class="btn">リセット</button>
    </div>

    <div class="help">
      <div>Lスティック: マウス</div>
      <div>Rスティック: 微調整</div>
      <div>A: 左クリック</div>
      <div>B: 右クリック</div>
      <div>十字←→: FDD2交換</div>
      <div>十字↑↓: FDD1交換</div>
      <div>Y: キーボード</div>
      <div>+: 終了</div>
    </div>

    <div id="status-bar">
      <span id="status-text">待機中</span>
      <span id="cpu-speed"></span>
      <span id="fdd-activity"></span>
      <span id="geom"></span>
    </div>
  </div>
</div>

<script>
'use strict';

// ===== js/mem.js =====
class Memory {
  constructor() {
    this.data = new Uint8Array(0x100000); // 1MB
    // BIOS data area callbacks for special memory ranges
    this._ioHandlers = { read: {}, write: {} };
  }

  mapIO(start, end, readFn, writeFn) {
    for (let a = start; a <= end; a += 2) {
      if (readFn)  this._ioHandlers.read[a]  = readFn;
      if (writeFn) this._ioHandlers.write[a] = writeFn;
    }
  }

  read8(addr) {
    addr &= 0xFFFFF;
    return this.data[addr];
  }

  write8(addr, val) {
    addr &= 0xFFFFF;
    val &= 0xFF;
    this.data[addr] = val;
  }

  read16(addr) {
    addr &= 0xFFFFF;
    return this.data[addr] | (this.data[(addr + 1) & 0xFFFFF] << 8);
  }

  write16(addr, val) {
    addr &= 0xFFFFF;
    this.data[addr] = val & 0xFF;
    this.data[(addr + 1) & 0xFFFFF] = (val >> 8) & 0xFF;
  }

  // Bulk load (for ROM/disk)
  load(addr, src, len) {
    len = len || src.length;
    for (let i = 0; i < len; i++) {
      this.data[(addr + i) & 0xFFFFF] = src[i];
    }
  }

  // Read null-terminated string
  readStr(addr) {
    let s = '';
    while (true) {
      const c = this.read8(addr++);
      if (!c) break;
      s += String.fromCharCode(c);
    }
    return s;
  }

  reset() {
    this.data.fill(0);
  }
}

// ===== js/io.js =====
class IO {
  constructor() {
    this._read  = new Array(0x10000).fill(null);
    this._write = new Array(0x10000).fill(null);
  }

  register(port, readFn, writeFn) {
    if (readFn)  this._read[port]  = readFn;
    if (writeFn) this._write[port] = writeFn;
  }

  // Register a range of ports
  registerRange(start, end, readFn, writeFn) {
    for (let p = start; p <= end; p++) {
      this.register(p, readFn, writeFn);
    }
  }

  read8(port) {
    port &= 0xFFFF;
    if (this._read[port]) return this._read[port](port) & 0xFF;
    if (this.debugUnknown) this._logUnknown('R', port);
    return 0xFF;
  }

  write8(port, val) {
    port &= 0xFFFF;
    val &= 0xFF;
    if (this._portWriteLog) {
      this._portWriteLog.set(port, (this._portWriteLog.get(port) || 0) + 1);
    }
    if (this._write[port]) { this._write[port](port, val); return; }
    if (this.debugUnknown) this._logUnknown('W', port, val);
  }

  _logUnknown(dir, port, val) {
    const k = `${dir}:${port.toString(16)}`;
    if (!this._unknownSeen) this._unknownSeen = new Map();
    const cnt = (this._unknownSeen.get(k) || 0) + 1;
    this._unknownSeen.set(k, cnt);
    if (cnt <= 3) console.warn(`IO ${dir} unknown port 0x${port.toString(16).padStart(4,'0')}` + (val !== undefined ? ` = 0x${val.toString(16).padStart(2,'0')}` : ''));
  }

  read16(port) {
    return this.read8(port) | (this.read8(port + 1) << 8);
  }

  write16(port, val) {
    this.write8(port, val & 0xFF);
    this.write8(port + 1, (val >> 8) & 0xFF);
  }
}

// ===== js/cpu.js =====
// NEC V30 / 8086 CPU emulator
class CPU {
  constructor(mem, io) {
    this.mem = mem;
    this.io  = io;

    // Registers
    this.ax = 0; this.bx = 0; this.cx = 0; this.dx = 0;
    this.si = 0; this.di = 0; this.bp = 0; this.sp = 0;
    this.ip = 0;
    this.cs = 0xF000; this.ds = 0; this.es = 0; this.ss = 0;
    this.flags = 0x0002;

    this.halted    = false;
    this.segOvr    = -1;   // segment override: -1=none 0=ES 1=CS 2=SS 3=DS
    this.repPrefix = 0;    // 0=none 0xF2=REPNE 0xF3=REP

    this._interruptQueue = [];
    this.totalCycles = 0;
  }

  // ── Register helpers ───────────────────────────────────────────────
  get al() { return  this.ax & 0xFF; }
  get ah() { return (this.ax >> 8) & 0xFF; }
  get bl() { return  this.bx & 0xFF; }
  get bh() { return (this.bx >> 8) & 0xFF; }
  get cl() { return  this.cx & 0xFF; }
  get ch() { return (this.cx >> 8) & 0xFF; }
  get dl() { return  this.dx & 0xFF; }
  get dh() { return (this.dx >> 8) & 0xFF; }

  set al(v) { this.ax = (this.ax & 0xFF00) | (v & 0xFF); }
  set ah(v) { this.ax = (this.ax & 0x00FF) | ((v & 0xFF) << 8); }
  set bl(v) { this.bx = (this.bx & 0xFF00) | (v & 0xFF); }
  set bh(v) { this.bx = (this.bx & 0x00FF) | ((v & 0xFF) << 8); }
  set cl(v) { this.cx = (this.cx & 0xFF00) | (v & 0xFF); }
  set ch(v) { this.cx = (this.cx & 0x00FF) | ((v & 0xFF) << 8); }
  set dl(v) { this.dx = (this.dx & 0xFF00) | (v & 0xFF); }
  set dh(v) { this.dx = (this.dx & 0x00FF) | ((v & 0xFF) << 8); }

  // Flags
  get CF() { return (this.flags >> 0) & 1; }
  get PF() { return (this.flags >> 2) & 1; }
  get AF() { return (this.flags >> 4) & 1; }
  get ZF() { return (this.flags >> 6) & 1; }
  get SF() { return (this.flags >> 7) & 1; }
  get TF() { return (this.flags >> 8) & 1; }
  get IF() { return (this.flags >> 9) & 1; }
  get DF() { return (this.flags >> 10) & 1; }
  get OF() { return (this.flags >> 11) & 1; }

  set CF(v) { this.flags = (this.flags & ~0x001) | (v ? 1 : 0); }
  set PF(v) { this.flags = (this.flags & ~0x004) | (v ? 4 : 0); }
  set AF(v) { this.flags = (this.flags & ~0x010) | (v ? 0x10 : 0); }
  set ZF(v) { this.flags = (this.flags & ~0x040) | (v ? 0x40 : 0); }
  set SF(v) { this.flags = (this.flags & ~0x080) | (v ? 0x80 : 0); }
  set TF(v) { this.flags = (this.flags & ~0x100) | (v ? 0x100 : 0); }
  set IF(v) { this.flags = (this.flags & ~0x200) | (v ? 0x200 : 0); }
  set DF(v) { this.flags = (this.flags & ~0x400) | (v ? 0x400 : 0); }
  set OF(v) { this.flags = (this.flags & ~0x800) | (v ? 0x800 : 0); }

  // ── Address helpers ────────────────────────────────────────────────
  seg2phys(seg, off) { return ((seg << 4) + (off & 0xFFFF)) & 0xFFFFF; }

  effSeg(def) {
    if (this.segOvr < 0) return def;
    return [this.es, this.cs, this.ss, this.ds][this.segOvr];
  }

  // ── Memory access ──────────────────────────────────────────────────
  rb(addr)      { return this.mem.read8(addr); }
  rw(addr)      { return this.mem.read16(addr); }
  wb(addr, v)   { this.mem.write8(addr, v); }
  ww(addr, v)   { this.mem.write16(addr, v); }

  // ── Fetch from CS:IP ───────────────────────────────────────────────
  nextB() {
    const v = this.rb(this.seg2phys(this.cs, this.ip));
    this.ip = (this.ip + 1) & 0xFFFF;
    return v;
  }
  nextW() {
    const lo = this.rb(this.seg2phys(this.cs, this.ip));
    this.ip = (this.ip + 1) & 0xFFFF;
    const hi = this.rb(this.seg2phys(this.cs, this.ip));
    this.ip = (this.ip + 1) & 0xFFFF;
    return lo | (hi << 8);
  }
  nextSB() { const v = this.nextB(); return v >= 0x80 ? v - 0x100 : v; }
  nextSW() { const v = this.nextW(); return v >= 0x8000 ? v - 0x10000 : v; }

  // ── Reg accessors ──────────────────────────────────────────────────
  getReg8(r) {
    switch (r) {
      case 0: return this.al; case 1: return this.cl;
      case 2: return this.dl; case 3: return this.bl;
      case 4: return this.ah; case 5: return this.ch;
      case 6: return this.dh; case 7: return this.bh;
    }
    return 0;
  }
  setReg8(r, v) {
    v &= 0xFF;
    switch (r) {
      case 0: this.al = v; break; case 1: this.cl = v; break;
      case 2: this.dl = v; break; case 3: this.bl = v; break;
      case 4: this.ah = v; break; case 5: this.ch = v; break;
      case 6: this.dh = v; break; case 7: this.bh = v; break;
    }
  }
  getReg16(r) {
    switch (r) {
      case 0: return this.ax; case 1: return this.cx;
      case 2: return this.dx; case 3: return this.bx;
      case 4: return this.sp; case 5: return this.bp;
      case 6: return this.si; case 7: return this.di;
    }
    return 0;
  }
  setReg16(r, v) {
    v &= 0xFFFF;
    switch (r) {
      case 0: this.ax = v; break; case 1: this.cx = v; break;
      case 2: this.dx = v; break; case 3: this.bx = v; break;
      case 4: this.sp = v; break; case 5: this.bp = v; break;
      case 6: this.si = v; break; case 7: this.di = v; break;
    }
  }
  getSReg(r) {
    switch (r) {
      case 0: return this.es; case 1: return this.cs;
      case 2: return this.ss; case 3: return this.ds;
    }
    return 0;
  }
  setSReg(r, v) {
    v &= 0xFFFF;
    switch (r) {
      case 0: this.es = v; break; case 1: this.cs = v; break;
      case 2: this.ss = v; break; case 3: this.ds = v; break;
    }
  }

  // ── ModRM decoder ──────────────────────────────────────────────────
  // Returns { addr, isReg, reg } where addr is physical address for memory operands
  decRM(modrm) {
    const mod = (modrm >> 6) & 3;
    const rm  = modrm & 7;
    if (mod === 3) return { isReg: true, reg: rm, addr: 0 };

    let ea = 0, seg = this.ds;
    switch (rm) {
      case 0: ea = (this.bx + this.si) & 0xFFFF; break;
      case 1: ea = (this.bx + this.di) & 0xFFFF; break;
      case 2: ea = (this.bp + this.si) & 0xFFFF; seg = this.ss; break;
      case 3: ea = (this.bp + this.di) & 0xFFFF; seg = this.ss; break;
      case 4: ea = this.si; break;
      case 5: ea = this.di; break;
      case 6:
        if (mod === 0) { ea = this.nextW(); seg = this.ds; }
        else           { ea = this.bp; seg = this.ss; }
        break;
      case 7: ea = this.bx; break;
    }
    if (mod === 1) ea = (ea + this.nextSB()) & 0xFFFF;
    else if (mod === 2) ea = (ea + this.nextSW()) & 0xFFFF;

    seg = this.effSeg(seg);
    return { isReg: false, reg: 0, addr: this.seg2phys(seg, ea), ea: ea & 0xFFFF };
  }

  getRM8(e)    { return e.isReg ? this.getReg8(e.reg)  : this.rb(e.addr); }
  setRM8(e, v) { if (e.isReg) this.setReg8(e.reg, v);  else this.wb(e.addr, v); }
  getRM16(e)   { return e.isReg ? this.getReg16(e.reg) : this.rw(e.addr); }
  setRM16(e,v) { if (e.isReg) this.setReg16(e.reg, v); else this.ww(e.addr, v); }

  // ── Flags ──────────────────────────────────────────────────────────
  parity(v) {
    v ^= v >> 4; v ^= v >> 2; v ^= v >> 1;
    return (~v) & 1;
  }
  szp8(v)  { this.ZF = !(v & 0xFF); this.SF = !!(v & 0x80);  this.PF = this.parity(v & 0xFF); }
  szp16(v) { this.ZF = !(v & 0xFFFF); this.SF = !!(v & 0x8000); this.PF = this.parity(v & 0xFF); }

  // ── ALU ────────────────────────────────────────────────────────────
  ADD8(a, b)  { const r = a+b; this.CF=r>0xFF; this.AF=!!((a^b^r)&0x10); this.OF=!!((~(a^b)&(a^r))&0x80);  this.szp8(r);  return r&0xFF; }
  ADD16(a,b)  { const r = a+b; this.CF=r>0xFFFF; this.AF=!!((a^b^r)&0x10); this.OF=!!((~(a^b)&(a^r))&0x8000); this.szp16(r); return r&0xFFFF; }
  ADC8(a, b)  { const c=this.CF,r=a+b+c; this.CF=r>0xFF; this.AF=!!((a^b^r)&0x10); this.OF=!!((~(a^b)&(a^r))&0x80);  this.szp8(r);  return r&0xFF; }
  ADC16(a,b)  { const c=this.CF,r=a+b+c; this.CF=r>0xFFFF; this.AF=!!((a^b^r)&0x10); this.OF=!!((~(a^b)&(a^r))&0x8000); this.szp16(r); return r&0xFFFF; }
  SUB8(a, b)  { const r = a-b; this.CF=r<0; this.AF=!!((a^b^r)&0x10); this.OF=!!(((a^b)&(a^r))&0x80);  this.szp8(r);  return r&0xFF; }
  SUB16(a,b)  { const r = a-b; this.CF=r<0; this.AF=!!((a^b^r)&0x10); this.OF=!!(((a^b)&(a^r))&0x8000); this.szp16(r); return r&0xFFFF; }
  SBB8(a, b)  { const c=this.CF,r=a-b-c; this.CF=r<0; this.AF=!!((a^b^r)&0x10); this.OF=!!(((a^b)&(a^r))&0x80);  this.szp8(r);  return r&0xFF; }
  SBB16(a,b)  { const c=this.CF,r=a-b-c; this.CF=r<0; this.AF=!!((a^b^r)&0x10); this.OF=!!(((a^b)&(a^r))&0x8000); this.szp16(r); return r&0xFFFF; }
  AND8(a, b)  { const r=a&b; this.CF=0;this.OF=0;this.AF=0; this.szp8(r);  return r; }
  AND16(a,b)  { const r=a&b; this.CF=0;this.OF=0;this.AF=0; this.szp16(r); return r; }
  OR8(a,  b)  { const r=a|b; this.CF=0;this.OF=0;this.AF=0; this.szp8(r);  return r; }

  _grp1b(sub, e, v, n) {
    switch (sub) {
      case 0: this.setRM8(e, this.ADD8(v, n)); break;
      case 1: this.setRM8(e, this.OR8(v, n));  break;
      case 2: this.setRM8(e, this.ADC8(v, n)); break;
      case 3: this.setRM8(e, this.SBB8(v, n)); break;
      case 4: this.setRM8(e, this.AND8(v, n)); break;
      case 5: this.setRM8(e, this.SUB8(v, n)); break;
      case 6: this.setRM8(e, this.XOR8(v, n)); break;
      case 7: this.CMP8(v, n);                 break;
    }
  }
  _grp1w(sub, e, v, n) {
    switch (sub) {
      case 0: this.setRM16(e,this.ADD16(v,n)); break;
      case 1: this.setRM16(e,this.OR16(v,n));  break;
      case 2: this.setRM16(e,this.ADC16(v,n)); break;
      case 3: this.setRM16(e,this.SBB16(v,n)); break;
      case 4: this.setRM16(e,this.AND16(v,n)); break;
      case 5: this.setRM16(e,this.SUB16(v,n)); break;
      case 6: this.setRM16(e,this.XOR16(v,n)); break;
      case 7: this.CMP16(v,n);                 break;
    }
  }
  _shiftRot8(sub, e, v, n) {

      case 2: r=this.RCL8(v,n); break; case 3: r=this.RCR8(v,n); break;
      case 4: case 6: r=this.SHL8(v,n); break;
      case 5: r=this.SHR8(v,n); break; case 7: r=this.SAR8(v,n); break;
      default: r=v;
    }
    this.setRM8(e, r);
  }
  _shiftRot16(sub, e, v, n) {
    let r;
    switch (sub) {
      case 0: r=this.ROL16(v,n); break; case 1: r=this.ROR16(v,n); break;
      case 2: r=this.RCL16(v,n); break; case 3: r=this.RCR16(v,n); break;
      case 4: case 6: r=this.SHL16(v,n); break;
      case 5: r=this.SHR16(v,n); break; case 7: r=this.SAR16(v,n); break;

  }
  _grp3b(sub, e) {
    const v = this.getRM8(e);
    switch (sub) {
      case 0: case 1: this.TEST8(v, this.nextB()); break;
      case 2: this.setRM8(e, this.NOT8(v)); break;
      case 3: this.setRM8(e, this.NEG8(v)); break;
      case 4: this.MUL8(v);  break;
      case 5: this.IMUL8(v); break;
      case 6: this.DIV8(v);  break;
      case 7: this.IDIV8(v); break;
    }
  }
  _grp3w(sub, e) {
    const v = this.getRM16(e);
    switch (sub) {
      case 0: case 1: this.TEST16(v, this.nextW()); break;
      case 2: this.setRM16(e,this.NOT16(v)); break;
      case 3: this.setRM16(e,this.NEG16(v)); break;
      case 4: this.MUL16(v);  break;
      case 5: this.IMUL16(v); break;
      case 6: this.DIV16(v);  break;
      case 7: this.IDIV16(v); break;
    }
  }
  _grp5(sub, e) {
    let v, off, seg;
    switch (sub) {
      case 0: this.setRM16(e,this.INC16(this.getRM16(e))); break;
      case 1: this.setRM16(e,this.DEC16(this.getRM16(e))); break;
      case 2: this.push(this.ip);this.ip=this.getRM16(e); break; // CALL near r/m
      case 3: // CALL far m16:16
        off=this.rw(e.addr); seg=this.rw((e.addr+2)&0xFFFFF);
        this.push(this.cs);this.push(this.ip);this.cs=seg;this.ip=off; break;
      case 4: this.ip=this.getRM16(e); break; // JMP near r/m
      case 5: // JMP far m16:16
        off=this.rw(e.addr); seg=this.rw((e.addr+2)&0xFFFFF);
        this.cs=seg;this.ip=off; break;
      case 6: this.push(this.getRM16(e)); break; // PUSH r/m

  // ── String operations ──────────────────────────────────────────────
  _strOp(op) {

        }
        case 0xAC: { // LODSB
          this.al=this.rb(this.seg2phys(this.effSeg(this.ds),this.si));
          this.si=(this.si+(this.DF?-1:1))&0xFFFF;
          break;
        }
        case 0xAD: { // LODSW
          this.ax=this.rw(this.seg2phys(this.effSeg(this.ds),this.si));
          this.si=(this.si+(this.DF?-2:2))&0xFFFF;
          break;
        }
        case 0xAE: { // SCASB
          const v=this.rb(this.seg2phys(this.es,this.di));
          this.SUB8(this.al,v);
          this.di=(this.di+(this.DF?-1:1))&0xFFFF;
          break;
        }
        case 0xAF: { // SCASW
          const v=this.rw(this.seg2phys(this.es,this.di));
          this.SUB16(this.ax,v);
          this.di=(this.di+(this.DF?-2:2))&0xFFFF;
          break;
        }
      }
      if (rep) {
        this.cx = (this.cx - 1) & 0xFFFF;
        if (!this.cx) break;
        // ZF check only applies to CMPS/SCAS
        if (op === 0xA6 || op === 0xA7 || op === 0xAE || op === 0xAF) {
          if (rep === 0xF2 && this.ZF)  break; // REPNE: stop if match
          if (rep === 0xF3 && !this.ZF) break; // REPE:  stop if no match
        }
      }
    } while (rep && this.cx);
  }

  reset() {
    this.ax=this.bx=this.cx=this.dx=0;
    this.si=this.di=this.bp=0;
    this.sp=0xFFFE;
    this.ip=0xFFF0; this.cs=0xF000;
    this.ds=this.es=this.ss=0;
    this.flags=0x0002;
    this.halted=false;
    this.segOvr=-1;
    this.repPrefix=0;
    this._interruptQueue=[];
    this.totalCycles=0;
  }
}

// ===== js/pic.js =====
// 8259A Programmable Interrupt Controller (PC-98: master 0x00/0x02, slave 0x08/0x0A)
// Master vector base 0x08 (IRQ0-7), slave vector base 0x10 (IRQ8-15)
class PIC {
  constructor(io, cpu) {
    this.cpu = cpu;

    this.master = this._mkUnit(0x08);
    this.slave  = this._mkUnit(0x10);

    // Master PIC: cmd 0x00, data 0x02
    io.register(0x00, () => this._readCmd(this.master), (p,v) => this._writeCmd(this.master, v));
    io.register(0x02, () => this.master.mask,           (p,v) => this._writeData(this.master, v));
    // Slave PIC: cmd 0x08, data 0x0A
    io.register(0x08, () => this._readCmd(this.slave),  (p,v) => this._writeCmd(this.slave, v));
    io.register(0x0A, () => this.slave.mask,            (p,v) => this._writeData(this.slave, v));
  }

  _mkUnit(base) {
    return { base, mask: 0xFF, irr: 0, isr: 0, icwStep: 0, readISR: false };
  }

  _readCmd(u) {
    return u.readISR ? u.isr : u.irr;
  }

  _writeCmd(u, v) {
    if (v & 0x10) {
      // ICW1: start init sequence
      u.icwStep = 1;
      u.mask = 0;
      u.irr = 0;
      u.isr = 0;
      u.readISR = false;
    } else if ((v & 0x18) === 0x08) {
      // OCW3
      if (v & 0x02) u.readISR = !!(v & 0x01);
    } else if (v === 0x20) {
      // Non-specific EOI
      for (let i = 0; i < 8; i++) {
        if (u.isr & (1 << i)) { u.isr &= ~(1 << i); break; }
      }
    } else if ((v & 0xE0) === 0x60) {
      // Specific EOI
      u.isr &= ~(1 << (v & 7));
    }
  }

  _writeData(u, v) {
    if (u.icwStep === 1) {
      // ICW2: vector base
      u.base = v & 0xF8;
      u.icwStep = 2;
    } else if (u.icwStep === 2) {
      // ICW3
      u.icwStep = 3;
    } else if (u.icwStep === 3) {
      // ICW4
      u.icwStep = 0;
    } else {
      // OCW1: interrupt mask
      u.mask = v;
    }
  }

  // Raise hardware IRQ (0-15)
  raise(irq) {
    const u  = irq < 8 ? this.master : this.slave;
    const ir = irq & 7;
    const bit = 1 << ir;
    if (u.mask & bit) return;        // masked
    if (u.isr & bit)  return;        // still being serviced
    u.irr |= bit;
    // Simplified ack: mark in-service immediately and queue to CPU
    u.irr &= ~bit;
    u.isr |= bit;
    this.cpu.requestInterrupt(u.base + ir);
  }

  reset() {
    this.master.mask = 0xFF; this.master.irr = 0; this.master.isr = 0;
    this.master.icwStep = 0; this.master.readISR = false; this.master.base = 0x08;
    this.slave.mask = 0xFF;  this.slave.irr = 0;  this.slave.isr = 0;
    this.slave.icwStep = 0;  this.slave.readISR = false;  this.slave.base = 0x10;
  }
}

// ===== js/pit.js =====
// 8253 Programmable Interval Timer
class PIT {
  constructor(io, pic) {
    this.pic = pic;
    this._counters = [
      { mode: 2, count: 0, latch: 0, reload: 0x10000, lowByte: true, out: true },
      { mode: 2, count: 0, latch: 0, reload: 0,       lowByte: true, out: true },
      { mode: 2, count: 0, latch: 0, reload: 0,       lowByte: true, out: true },
    ];
    this._cycleAccum = 0;
    // PC-98: PIT ports at 0x71,0x73,0x75,0x77
    io.register(0x71, () => this._read(0), (p,v) => this._write(0,v));
    io.register(0x73, () => this._read(1), (p,v) => this._write(1,v));
    io.register(0x75, () => this._read(2), (p,v) => this._write(2,v));
    io.register(0x77, () => 0,             (p,v) => this._control(v));
  }

  _control(v) {
    const ch = (v >> 6) & 3;
    if (ch === 3) return; // read-back
    const rw = (v >> 4) & 3;
    const mode = (v >> 1) & 7;
    const c = this._counters[ch];
    c.mode = mode;
    c.lowByte = true;
    if (rw === 0) { c.latch = c.count; }
  }

  _read(ch) {
    const c = this._counters[ch];
    if (c.lowByte) { c.lowByte = false; return c.count & 0xFF; }
    c.lowByte = true;
    return (c.count >> 8) & 0xFF;
  }

  _write(ch, v) {
    const c = this._counters[ch];
    if (c.lowByte) { c.latch = v; c.lowByte = false; }
    else {
      c.reload = c.latch | (v << 8);
      if (!c.reload) c.reload = 0x10000;
      c.count  = c.reload;
      c.lowByte = true;
    }
  }

  // Called with CPU cycles elapsed, generates IRQ0 (timer tick)
  tick(cycles) {
    this._cycleAccum += cycles;
    // PC-98 timer: ~2.4576MHz, IRQ0 at ~100Hz (10ms)
    // 2457600 / 100 = 24576 cycles per tick (approximately)
    const CYCLES_PER_TICK = 24576;
    while (this._cycleAccum >= CYCLES_PER_TICK) {
      this._cycleAccum -= CYCLES_PER_TICK;
      this.pic.raise(0); // IRQ0 → INT 08h
    }
  }

  reset() {
    this._cycleAccum = 0;
    for (const c of this._counters) {
      c.count = c.reload = 0x10000;
      c.lowByte = true;
    }
  }
}

// ===== js/fdi.js =====
// FDI disk image format parser
// Header: 4096 bytes (offset 0x1000), then raw sector data
// Layout: tracks * sides * sectors * sector_size
class FDI {
  constructor(buffer) {
    const u8 = new Uint8Array(buffer);
    const u32 = (off) => u8[off]|(u8[off+1]<<8)|(u8[off+2]<<16)|(u8[off+3]<<24);

    this.headerSize   = u32(8);   // 0x1000 = 4096
    this.diskSize     = u32(12);  // raw data size
    this.sectorSize   = u32(16);  // bytes per sector (1024 for 2HD)
    this.sectorsPerTrk= u32(20);  // sectors per track
    this.sides        = u32(24);  // number of sides
    this.tracks       = u32(28);  // tracks per side

    // Defaults for standard 2HD if header seems zero
    if (!this.sectorSize)    this.sectorSize    = 1024;
    if (!this.sectorsPerTrk) this.sectorsPerTrk = 8;
    if (!this.sides)         this.sides         = 2;
    if (!this.tracks)        this.tracks        = 77;
    if (!this.headerSize)    this.headerSize    = 4096;

    // Extract raw disk data
    this.data = u8.slice(this.headerSize);
    this.writeProtect = false;
  }

  // Compute byte offset for given CHS (0-based cylinder, 0-based head, 1-based sector)
  _offset(cylinder, head, sector) {
    const trackIdx = cylinder * this.sides + head;
    const secIdx   = sector - 1; // sectors are 1-based
    return (trackIdx * this.sectorsPerTrk + secIdx) * this.sectorSize;
  }

  // Read one sector into dst Uint8Array
  readSector(cylinder, head, sector, dst) {
    const off = this._offset(cylinder, head, sector);
    if (off + this.sectorSize > this.data.length) return false;
    dst.set(this.data.subarray(off, off + this.sectorSize));
    return true;
  }

  // Write one sector from src Uint8Array
  writeSector(cylinder, head, sector, src) {
    if (this.writeProtect) return false;
    const off = this._offset(cylinder, head, sector);
    if (off + this.sectorSize > this.data.length) return false;
    this.data.set(src.subarray(0, this.sectorSize), off);
    return true;
  }

  isValid() {
    return this.data && this.data.length > 0;
  }

  get typeStr() {
    if (this.sides === 2 && this.tracks === 77 && this.sectorSize === 1024) return '2HD';
    if (this.sides === 2 && this.tracks === 80 && this.sectorSize === 512)  return '2DD';
    return 'FDI';
  }
}

// ===== js/fdc.js =====
// NEC µPD765A Floppy Disk Controller
// PC-98 ports: 0x90 (status), 0x92 (data), 0x94 (motor control)
class FDC {
  constructor(io, pic, mem) {
    this.pic  = pic;
    this.mem  = mem;
    this.disk = [null, null]; // FDI images for drive 0 and 1

    this._msr  = 0x80; // Main Status Register (RQM=1, ready)
    this._cmd  = [];   // command bytes
    this._res  = [];   // result bytes
    this._state= 'idle'; // 'idle','cmd','exec','result'
    this._buf  = new Uint8Array(1024);

    // Track/head/sector for DMA transfer
    this._C = 0; this._H = 0; this._R = 0; this._N = 0;
    this._drive  = 0;
    this._motor  = [false, false];
    this._dmaAddr= 0;
    this._dmaCount=0;
    this._intPending = false;

    io.register(0x90, () => this._readMSR(), null);
    io.register(0x92, () => this._readData(), (p,v) => this._writeData(v));
    io.register(0x94, null, (p,v) => this._writeMotor(v));
    io.register(0xBE, null, (p,v) => {}); // density select (ignore)
    io.register(0x4BE, null, (p,v) => {}); // FDD wait
  }

  mount(driveNo, fdi) {
    this.disk[driveNo] = fdi;
  }

  _readMSR() {
    let msr = 0x80; // RQM
    if (this._state === 'result' && this._res.length > 0) msr |= 0x40; // DIO=1 (output)
    if (this._state === 'cmd')    msr |= 0x10; // FDC busy
    if (this._state === 'exec')   msr |= 0x20; // exec phase
    return msr;
  }

  _readData() {
    if (this._state === 'result' && this._res.length > 0) {
      const b = this._res.shift();
      if (this._res.length === 0) {
        this._state = 'idle';
      }
      return b;
    }
    return 0;
  }

  _writeData(v) {
    if (this._state === 'idle' || this._state === 'cmd') {
      this._state = 'cmd';
      this._cmd.push(v);
      this._tryExecute();
    }
  }

  _writeMotor(v) {
    // bit0=drive0 motor, bit1=drive1 motor, bit2=drive select, bit4=?
    this._motor[0] = !!(v & 0x01);
    this._motor[1] = !!(v & 0x02);
    this._drive = (v >> 4) & 1;
  }

  _tryExecute() {
    if (!this._cmd.length) return;
    const cmd = this._cmd[0] & 0x1F;

    // Detect complete command
    const cmdLen = {
      0x03: 3, // Specify
      0x04: 2, // Sense Drive Status
      0x07: 2, // Recalibrate
      0x08: 1, // Sense Interrupt
      0x0F: 3, // Seek
      0x02: 9, // Read Track
      0x05: 9, // Write Data
      0x06: 9, // Read Data
      0x09: 9, // Write Deleted Data
      0x0A: 2, // Read ID
      0x0C: 9, // Read Deleted Data
      0x0D: 6, // Format Track
      0x11: 9, // Scan Equal
      0x19: 9, // Scan Low
      0x1D: 9, // Scan High
    };

    const needed = cmdLen[cmd] || 1;
    if (this._cmd.length < needed) return;

    this._state = 'exec';
    this._execute();
    this._cmd = [];
  }

  _execute() {
    const cmd = this._cmd[0] & 0x1F;
    const mt  = !!(this._cmd[0] & 0x80);
    const mfm = !!(this._cmd[0] & 0x40);

    switch (cmd) {
      case 0x03: // Specify
        this._state = 'idle'; return;

      case 0x04: // Sense Drive Status
        this._res = [0x28]; // ready, two-sided, disk present
        this._state = 'result'; return;

      case 0x07: // Recalibrate
        this._C = 0;
        this._sendInterrupt();
        this._state = 'idle'; return;

      case 0x08: // Sense Interrupt Status
        this._res = [0x20 | this._drive, this._C];
        this._state = 'result';
        this._intPending = false; return;

      case 0x0F: // Seek
        this._drive = this._cmd[1] & 3;
        this._C = this._cmd[2];
        this._sendInterrupt();
        this._state = 'idle'; return;

      case 0x06: case 0x0C: // Read Data / Read Deleted Data
        this._doRead(); return;

      case 0x05: case 0x09: // Write Data / Write Deleted Data
        this._doWrite(); return;

      case 0x0A: // Read ID
        this._res = [0x00, 0x00, this._C, this._H, 0x01, 0x03, 0x08, 0x00];
        this._sendInterrupt();
        this._state = 'result'; return;

      case 0x0D: // Format Track
        this._state = 'idle'; return;

      default:
        this._state = 'idle'; return;
    }
  }

  _doRead() {
    const drv = this._cmd[1] & 3;
    const C   = this._cmd[2];
    const H   = this._cmd[3];
    const R   = this._cmd[4];
    const N   = this._cmd[5];
    const EOT = this._cmd[6];
    const fdi = this.disk[drv];

    this._C = C; this._H = H; this._R = R;

    if (!fdi) {
      this._res = [0x40, 0x00, C, H, R, N];
      this._state = 'result';
      return;
    }

    const sectorSize = 128 << N; // N=3 → 1024
    const buf = new Uint8Array(sectorSize);

    // Read sectors R through EOT (real FDC multi-sector transfer).
    // Cap by DMA count so we never overflow the programmed buffer.
    const maxBytes = this._dmaCount > 0 ? this._dmaCount + 1 : sectorSize;
    let transferred = 0;
    let curR = R;
    while (curR <= EOT && transferred + sectorSize <= maxBytes) {
      const ok = fdi.readSector(C, H, curR, buf);
      if (!ok) {
        this._res = [0x40, 0x04, C, H, curR, N];
        this._state = 'result';
        return;
      }
      for (let i = 0; i < sectorSize; i++) {
        this.mem.write8(this._dmaAddr + i, buf[i]);
      }
      this._dmaAddr += sectorSize;
      transferred  += sectorSize;
      curR++;
    }

    // Status: next sector number (or EOT+1)
    this._res = [0x00, 0x00, C, H, curR, N];
    this._sendInterrupt();
    this._state = 'result';
  }

  _doWrite() {
    const drv = this._cmd[1] & 3;
    const C   = this._cmd[2];
    const H   = this._cmd[3];
    const R   = this._cmd[4];
    const N   = this._cmd[5];
    const fdi = this.disk[drv];

    if (!fdi || fdi.writeProtect) {
      this._res = [0x40, 0x02, C, H, R, N];
      this._state = 'result';
      return;
    }

    const sectorSize = 128 << N;
    const buf = new Uint8Array(sectorSize);
    const dmaAddr = this._dmaAddr;
    for (let i = 0; i < sectorSize; i++) {
      buf[i] = this.mem.read8(dmaAddr + i);
    }
    fdi.writeSector(C, H, R, buf);
    this._dmaAddr += sectorSize;

    this._res = [0x00, 0x00, C, H, R+1, N];
    this._sendInterrupt();
    this._state = 'result';
  }

  _sendInterrupt() {
    this._intPending = true;
    this.pic.raise(6); // IRQ6 → FDC
  }

  setDMA(addr, count) {
    this._dmaAddr  = addr;
    this._dmaCount = count;
  }

  reset() {
    this._cmd = [];
    this._res = [];
    this._state = 'idle';
    this._intPending = false;
  }
}

// ===== js/video.js =====
// PC-98 Video System
// - Text VRAM:  0xA0000-0xA3FFF (character codes + attributes, 80×25)
// - GVRAM:      0xA8000-0xBFFFF (4 planes, 640×400 pixels)
// - CRT controller at 0xC0-0xCF, 0xD0-0xD5
class Video {
  // Optional pre-rendered CG ROM bytes (Uint8Array); null = rasterize via canvas font
  static cgrom = null;

  // `presenter` (optional) takes over putting the composed framebuffer on
  // screen: it receives the 640x400 RGBA bytes each frame. Supplied when the
  // host needs a presentation path other than Canvas 2D — a canvas can only
  // ever have one context type, so when a presenter is given this class must
  // not ask for a 2D context at all.
  constructor(canvas, mem, io, presenter) {
    this.mem    = mem;
    this.canvas = canvas;
    this.presenter = presenter || null;
    if (this.presenter) {
      this.ctx     = null;
      this.imgData = { data: new Uint8ClampedArray(640 * 400 * 4), width: 640, height: 400 };
    } else {
      this.ctx     = canvas.getContext('2d');
      this.imgData = this.ctx.createImageData(640, 400);
    }

    // GVRAM: 4 planes × 2 pages. Each page is a 32KB window (640×400/8 = 32000
    // bytes used); page 1 lives at offset 0x8000 within each plane array.
    // Port 0xA6 selects the CPU-access page, 0xA4 the displayed page.
    this.plane  = [
      new Uint8Array(65536), // Blue  (plane 0)
      new Uint8Array(65536), // Red   (plane 1)
      new Uint8Array(65536), // Green (plane 2)
      new Uint8Array(65536), // Intensity (plane 3)
    ];
    this._dispPage = 0; // port 0xA4: displayed page
    this._accPage  = 0; // port 0xA6: CPU access page

    // Text VRAM maps
    // PC-98 text: 0xA0000-0xA1FFF = character codes (word-addressed, 80 cols × 25 rows)
    //             0xA2000-0xA3FFF = attributes
    // Each text cell: code at A0000 + (row*80+col)*2, attr at A2000 + same

    this._grcgMode   = 0;     // port 0x7C: bit7=on, bit6=TDW/RMW, bits0-3=plane protect
    this._grcgTile   = new Uint8Array(4);
    this._grcgTileIdx= 0;
    this._palette    = new Uint32Array(16); // canvas Uint32 (0xAABBGGRR)
    this._initPalette();

    this._mode16     = true;  // 16-color mode (port 0x6A bit0)
    this._palIdx     = 0;
    this._palR = new Uint8Array(16);
    this._palG = new Uint8Array(16);
    this._palB = new Uint8Array(16);

    // Cycle source for VSYNC timing (injected by pc98.js); fallback counter
    this.getCycles = null;
    this._statusReads = 0;

    // GDC status (text 0x60, graphics 0xA0): bit5=VSYNC, bit2=FIFO empty
    const gdcStatus = () => 0x04 | (this._vsyncActive() ? 0x20 : 0);
    io.register(0x60, gdcStatus, (p,v) => {});  // text GDC param/status
    io.register(0x62, () => 0x04, (p,v) => {}); // text GDC command
    io.register(0xA0, gdcStatus, (p,v) => {});  // graphics GDC param/status
    io.register(0xA2, () => 0x04, (p,v) => {}); // graphics GDC command
    io.register(0x64, null, (p,v) => {});       // CRT interrupt reset

    // Mode flip-flops
    io.register(0x68, null, (p,v) => {});
    io.register(0x6A, null, (p,v) => { if (v === 0x01) this._mode16 = true; else if (v === 0x00) this._mode16 = false; });

    // GRCG: mode 0x7C, tile 0x7E
    io.register(0x7C, () => this._grcgMode, (p,v) => { this._grcgMode = v; this._grcgTileIdx = 0; });
    io.register(0x7E, null, (p,v) => { this._grcgTile[this._grcgTileIdx] = v; this._grcgTileIdx = (this._grcgTileIdx + 1) & 3; });

    // Page select: 0xA4 = displayed page, 0xA6 = CPU access page
    io.register(0xA4, () => this._dispPage, (p,v) => { this._dispPage = v & 1; this._dirty = true; });
    io.register(0xA6, () => this._accPage,  (p,v) => { this._accPage  = v & 1; });

    // CG ROM (kanji font) access: 0xA1=JIS 2nd byte-0x20, 0xA3=JIS 1st byte-0x20,
    // 0xA5=line select (bit5: 0=left half, 1=right half), 0xA9=font data
    this._cgLo = 0; this._cgHi = 0; this._cgLine = 0;
    this._cgCache = new Map();
    io.register(0xA1, () => this._cgLo, (p,v) => { this._cgLo = v; });
    io.register(0xA3, () => this._cgHi, (p,v) => { this._cgHi = v; });
    io.register(0xA5, () => this._cgLine, (p,v) => { this._cgLine = v; });
    io.register(0xA9, () => this._readCG(), (p,v) => {});

    // Analog palette: 0xA8=index, 0xAA=green, 0xAC=red, 0xAE=blue (4-bit each)
    io.register(0xA8, () => this._palIdx, (p,v) => { this._palIdx = v & 0x0F; });
    io.register(0xAA, () => this._palG[this._palIdx], (p,v) => { this._palG[this._palIdx] = v & 0x0F; this._updatePalette(this._palIdx); });
    io.register(0xAC, () => this._palR[this._palIdx], (p,v) => { this._palR[this._palIdx] = v & 0x0F; this._updatePalette(this._palIdx); });
    io.register(0xAE, () => this._palB[this._palIdx], (p,v) => { this._palB[this._palIdx] = v & 0x0F; this._updatePalette(this._palIdx); });

    // EGC (Enhanced Graphic Controller) at 0x4A0-0x4AE (16-bit registers)
    // Used for hardware-accelerated VRAM blits (bit-aligned copy, ROP, pattern fill, etc.)
    this._egcRegs = new Uint16Array(8);   // 0x4A0,4A2,4A4,4A6,4A8,4AA,4AC,4AE
    this._egcLatch= new Uint8Array(4);    // 4-plane read latch
    this._egcEnabled = false;
    this._egcLogCount = 0;
    for (let i = 0; i < 8; i++) {
      const regIdx = i;
      const port = 0x4A0 + i * 2;
      io.register(port,
        () => this._egcRegs[regIdx] & 0xFF,
        (p, v) => {
          this._egcRegs[regIdx] = (this._egcRegs[regIdx] & 0xFF00) | v;
          this._egcOnWrite(regIdx);
        });
      io.register(port + 1,
        () => (this._egcRegs[regIdx] >> 8) & 0xFF,
        (p, v) => {
          this._egcRegs[regIdx] = (this._egcRegs[regIdx] & 0x00FF) | (v << 8);
          this._egcOnWrite(regIdx);
        });
    }

    // 8-color digital palette
    this._digitalPal = [
      0xFF000000, 0xFF0000AA, 0xFF00AA00, 0xFF00AAAA,
      0xFFAA0000, 0xFFAA00AA, 0xFFAA5500, 0xFFAAAAAA,
      0xFF555555, 0xFF5555FF, 0xFF55FF55, 0xFF55FFFF,
      0xFFFF5555, 0xFFFF55FF, 0xFFFFFF55, 0xFFFFFFFF,
    ];
    this._palette.set(this._digitalPal);

    // Font ROM (16x16 kanji or 8x16 ANK)
    this._font = null;
    this._buildDefaultFont();

    // VRAM write intercept
    this._setupVRAMHooks();

    this._showText = true;
    this._showGraph= true;
    this._dirty    = true;
  }

  // Called whenever an EGC register is written
  _egcOnWrite(regIdx) {
    // reg[0]=0x4A0: access control; if any write → EGC is being used
    if (regIdx === 0) {
      const was = this._egcEnabled;
      this._egcEnabled = (this._egcRegs[0] !== 0);
      if (!was && this._egcEnabled && this._egcLogCount < 20) {
        this._egcLogCount++;
        const regs = Array.from(this._egcRegs).map(r => '0x'+r.toString(16).padStart(4,'0'));
        console.log('[EGC] enabled, regs:', regs.join(' '));
      }
    }
  }

  // Debug: return per-plane statistics (call from browser console: pc98.video.debugPlanes())
  debugPlanes() {
    const r = {};
    for (let pg = 0; pg < 2; pg++) {
      for (let p = 0; p < 4; p++) {
        let nonZero = 0, sum = 0;
        const base = pg << 15;
        for (let i = 0; i < 32000; i++) { const v = this.plane[p][base + i]; if (v) nonZero++; sum = (sum + v) & 0xFFFF; }
        r[`pg${pg}p${p}`] = { nonZero, sum: '0x'+sum.toString(16) };
      }
    }
    console.log('VRAM planes:', JSON.stringify(r), 'disp=', this._dispPage, 'acc=', this._accPage);
    return r;
  }

  _initPalette() {
    this._palette.set([
      0xFF000000, 0xFF0000AA, 0xFF00AA00, 0xFF00AAAA,
      0xFFAA0000, 0xFFAA00AA, 0xFFAA5500, 0xFFAAAAAA,
      0xFF555555, 0xFF5555FF, 0xFF55FF55, 0xFF55FFFF,
      0xFFFF5555, 0xFFFF55FF, 0xFFFFFF55, 0xFFFFFFFF,
    ]);
  }

  // VSYNC simulation: ~56.4Hz frame = ~177240 CPU cycles at 10MHz.
  // VSYNC active during the last ~4% of each frame.
  _vsyncActive() {
    if (this.getCycles) {
      const pos = this.getCycles() % 177240;
      return pos >= 170000;
    }
    // Fallback: toggle pattern so polling loops always see both edges
    this._statusReads++;
    return (this._statusReads % 16) >= 13;
  }

  // CG ROM read: returns one byte of the current glyph row
  // Line register bit5: 1 = LEFT half (high bits), 0 = RIGHT half (low bits)
  _readCG() {
    const g = this._getGlyph();
    const row = this._cgLine & 0x0F;
    const w = g[row];
    // ANK (8-dot) glyphs live in the high byte regardless of half select
    if ((this._cgHi & 0x7F) === 0) return (w >> 8) & 0xFF;
    const left = !!(this._cgLine & 0x20);
    return left ? ((w >> 8) & 0xFF) : (w & 0xFF);
  }

  // Rasterize the glyph for the current CG code (16×16, Uint16Array of rows)
  _getGlyph() {
    const key = ((this._cgHi & 0xFF) << 8) | (this._cgLo & 0xFF);
    let g = this._cgCache.get(key);
    if (g) return g;
    g = new Uint16Array(16);

    let ch = null;
    // CG code format: 0xA3 = JIS 1st byte - 0x20, 0xA1 = JIS 2nd byte (raw)
    const j1 = (this._cgHi & 0x7F) + 0x20;
    const j2 = this._cgLo & 0x7F;

    // Pre-rendered CG ROM (cgrom.bin, see tools/gen_cgrom.py). Used on
    // runtimes without a Japanese canvas font / TextDecoder('shift_jis').
    const rom = Video.cgrom;
    if (rom) {
      if ((this._cgHi & 0x7F) === 0) {
        const base = (this._cgLo & 0xFF) * 16;
        for (let y = 0; y < 16; y++) g[y] = rom[base + y] << 8;
      } else if (j1 >= 0x21 && j1 <= 0x7E && j2 >= 0x21 && j2 <= 0x7E) {
        const base = 4096 + ((j1 - 0x21) * 94 + (j2 - 0x21)) * 32;
        for (let y = 0; y < 16; y++) g[y] = (rom[base + y * 2] << 8) | rom[base + y * 2 + 1];
      }
      this._cgCache.set(key, g);
      return g;
    }
    try {
      if ((this._cgHi & 0x7F) === 0) {
        // ANK (8×16): code = low byte
        const c = this._cgLo & 0xFF;
        if (c >= 0xA1 && c <= 0xDF) ch = String.fromCharCode(0xFF61 + c - 0xA1); // halfwidth kana
        else if (c >= 0x20 && c < 0x7F) ch = String.fromCharCode(c);
      } else {
        // Kanji: JIS → Shift_JIS → Unicode
        const s1 = ((j1 + 1) >> 1) + (j1 < 0x5F ? 0x70 : 0xB0);
        const s2 = j2 + ((j1 & 1) ? (j2 < 0x60 ? 0x1F : 0x20) : 0x7E);
        ch = new TextDecoder('shift_jis').decode(new Uint8Array([s1, s2]));
      }
    } catch (e) { ch = null; }

    if (ch && typeof document !== 'undefined') {
      // Browser: render with a Japanese monospace font
      if (!this._cgCanvas) {
        this._cgCanvas = document.createElement('canvas');
        this._cgCanvas.width = 16; this._cgCanvas.height = 16;
      }
      const cx = this._cgCanvas.getContext('2d', { willReadFrequently: true });
      cx.clearRect(0, 0, 16, 16);
      cx.fillStyle = '#fff';
      cx.font = '16px "MS Gothic", "Osaka-Mono", monospace';
      cx.textBaseline = 'top';
      cx.fillText(ch, 0, 0);
      const d = cx.getImageData(0, 0, 16, 16).data;
      for (let y = 0; y < 16; y++) {
        let row = 0;
        for (let x = 0; x < 16; x++) {
          if (d[(y * 16 + x) * 4 + 3] > 96) row |= 0x8000 >> x;
        }
        g[y] = row;
      }
    } else if (ch) {
      // Headless fallback: distinct box pattern per glyph
      g[1] = 0x7FFE; g[14] = 0x7FFE;
      let h = (key * 2654435761) >>> 0;
      for (let y = 2; y < 14; y++) {
        g[y] = 0x4002 | (h & 0x0FF0);
        h = (h * 16807 + 7) >>> 0;
      }
    }
    this._cgCache.set(key, g);
    return g;
  }

  _updatePalette(i) {
    const r = this._palR[i] * 17, g = this._palG[i] * 17, b = this._palB[i] * 17;
    this._palette[i] = 0xFF000000 | (b << 16) | (g << 8) | r;
    this._dirty = true;
  }
